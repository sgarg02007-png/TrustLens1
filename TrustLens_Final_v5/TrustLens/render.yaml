services:
  - type: web
    name: trustlens
    runtime: python
    plan: free
    buildCommand: pip install --prefer-binary -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
